        eyedropper: <><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3Z"/></>,
        textType: <><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></>,
        cursor: <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>,
        sticky: <><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><polyline points="15 3 15 9 21 9"/></>,
        undo: <><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></>,
        redo: <><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></>,
        share: <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></>
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    }

    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function getInitialRoom() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("room");
      if (fromUrl && fromUrl.trim()) return fromUrl.trim().toUpperCase().slice(0, 12);
      const saved = localStorage.getItem("syncpad_active_room");
      if (saved) return saved;
      const fresh = generateRoomCode();
      localStorage.setItem("syncpad_active_room", fresh);
      return fresh;
    }

    function App() {
      const [roomCode, setRoomCode] = useState(getInitialRoom);
      const [roomInput, setRoomInput] = useState(getInitialRoom);
      const [viewMode, setViewMode] = useState("split");
      const [copied, setCopied] = useState(false);
      const [syncStatus, setSyncStatus] = useState("Connecting...");
      const [activeDevices, setActiveDevices] = useState(1);
      const [confirmClear, setConfirmClear] = useState(false);
      const [isGeneratingRoom, setIsGeneratingRoom] = useState(false);

      const [notes, setNotes] = useState(() => [
        {
          id: "note-1",
          title: "Shared Scratchpad",
          content: "# SyncPad Cloud Sync\n\nNotes stay editable after creation and sync across your devices."
        }
      ]);
      const [activeNoteId, setActiveNoteId] = useState("note-1");
      const [previewMode, setPreviewMode] = useState(false);

      const [tool, setTool] = useState("pen");
      const [color, setColor] = useState("#38bdf8");
      const [strokeSize, setStrokeSize] = useState(4);
      const [fillShape, setFillShape] = useState(false);
      const [selectedId, setSelectedId] = useState(null);
      const [elements, setElements] = useState([]);
      const [history, setHistory] = useState([]);
      const [redoStack, setRedoStack] = useState([]);

      const [zenMode, setZenMode] = useState(false);
      const [stylusOnly, setStylusOnly] = useState(false);
      const [canvasModal, setCanvasModal] = useState(null);

      const [viewport, setViewport] = useState({ panX: 24, panY: 24, zoom: 1 });
      const viewportRef = useRef(viewport);
      viewportRef.current = viewport;

      const draftElementRef = useRef(null);
      const moveStateRef = useRef(null);
      const activePointersRef = useRef(new Map());
      const pinchStateRef = useRef(null);
      const canvasRef = useRef(null);
      const canvasModalInputRef = useRef(null);
      const fillImageCacheRef = useRef(new Map());
      const isApplyingRemoteRef = useRef(false);
      const lastWrittenAtRef = useRef(0);
      const saveTimerRef = useRef(null);

      const storageKey = `syncpad_room_${roomCode}`;

      useEffect(() => {
        localStorage.setItem("syncpad_active_room", roomCode);
        const url = new URL(window.location.href);
        url.searchParams.set("room", roomCode);
        window.history.replaceState({}, "", url.toString());
      }, [roomCode]);

      useEffect(() => {
        if (!window.__syncpadCloud?.enabled || typeof window.__syncpadCloud.trackPresence !== "function") {
          setActiveDevices(1);
          return;
        }
        const stopPresence = window.__syncpadCloud.trackPresence(roomCode, (count) => {
          setActiveDevices(count);
        });
        return () => stopPresence && stopPresence();
      }, [roomCode]);

      useEffect(() => {
        if (canvasModal && canvasModalInputRef.current) {
          const timer = setTimeout(() => {
            canvasModalInputRef.current?.focus();
            canvasModalInputRef.current?.select();
          }, 30);
          return () => clearTimeout(timer);
        }
      }, [canvasModal]);

      useEffect(() => {
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
          saveTimerRef.current = null;
        }

        let hydratedLocal = false;
        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            hydratedLocal = true;
            isApplyingRemoteRef.current = true;
            if (Array.isArray(parsed.notes) && parsed.notes.length > 0) {
              setNotes(parsed.notes);
              setActiveNoteId(parsed.activeNoteId || parsed.notes[0].id);
            }
            if (Array.isArray(parsed.elements)) {
              setElements(parsed.elements.map(decodeElementFromCloud).filter(Boolean));
            } else {
              setElements([]);
            }
          }
        } catch (e) {
          console.error("Local cache read error", e);
        }

        const clearHydrateGuardTimer = hydratedLocal
          ? setTimeout(() => {
              isApplyingRemoteRef.current = false;
            }, 60)
          : null;

        if (!window.__syncpadCloud?.enabled) {
          setSyncStatus("Local only (add Firebase config)");
          return () => {
            if (clearHydrateGuardTimer) clearTimeout(clearHydrateGuardTimer);
          };
        }

        setSyncStatus("Live Cloud");
        const unsubscribe = window.__syncpadCloud.subscribeRoom(roomCode, (remoteData) => {
          if (Date.now() - lastWrittenAtRef.current < 400) return;
          if (!remoteData || (remoteData.updatedAt && remoteData.updatedAt < lastWrittenAtRef.current)) return;

          isApplyingRemoteRef.current = true;
          if (Array.isArray(remoteData.notes) && remoteData.notes.length > 0) {
            setNotes(remoteData.notes);
          }
          if (Array.isArray(remoteData.elements)) {
            setElements(remoteData.elements.map(decodeElementFromCloud).filter(Boolean));
          } else {
            setElements([]);
          }
          setSyncStatus("Synced from cloud");
          setTimeout(() => {
            isApplyingRemoteRef.current = false;
          }, 50);
        });

        return () => {
          if (clearHydrateGuardTimer) clearTimeout(clearHydrateGuardTimer);
          unsubscribe && unsubscribe();
        };
      }, [roomCode, storageKey]);

      useEffect(() => {
        const compressedElements = elements.map(encodeElementForCloud);
        const payload = {
          notes,
          elements: compressedElements,
          activeNoteId,
          updatedAt: Date.now()
        };

        try {
          localStorage.setItem(storageKey, JSON.stringify(payload));
        } catch (e) {
          console.error("Local storage save error", e);
        }

        if (isApplyingRemoteRef.current || !window.__syncpadCloud?.enabled) return;

        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(async () => {
          try {
            const ts = Date.now();
            lastWrittenAtRef.current = ts;
            await window.__syncpadCloud.saveRoom(roomCode, { ...payload, updatedAt: ts });
            setSyncStatus("Live Cloud");
          } catch (err) {
            console.error("Firebase write error:", err);
            setSyncStatus("Sync error (check rules)");
          }
        }, 250);

        return () => {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        };
      }, [notes, elements, activeNoteId, roomCode, storageKey]);

      const activeIndex = notes.findIndex((n) => n.id === activeNoteId);
      const resolvedIndex = activeIndex >= 0 ? activeIndex : 0;
      const activeNote = notes[resolvedIndex] || notes[0];

      const updateNoteContent = (value) => {
        setNotes((prev) => prev.map((n) => (n.id === activeNote.id ? { ...n, content: value } : n)));
      };

      const updateNoteTitle = (value) => {
        setNotes((prev) => prev.map((n) => (n.id === activeNote.id ? { ...n, title: value } : n)));
      };

      const addNote = () => {
        const id = `note-${Date.now()}`;
        const created = { id, title: `Note ${notes.length + 1}`, content: "" };
        setNotes((prev) => [...prev, created]);
        setActiveNoteId(id);
        setPreviewMode(false);
      };

      const duplicateNote = (id = activeNote.id) => {
        const source = notes.find((n) => n.id === id) || activeNote;
        if (!source) return;
        const copyId = `note-${Date.now()}`;
        const baseTitle = (source.title || "Untitled").trim();
        const duplicated = {
          id: copyId,
          title: `${baseTitle} (Copy)`,
          content: source.content || ""
        };
        setNotes((prev) => {
          const idx = prev.findIndex((n) => n.id === source.id);
          if (idx === -1) return [...prev, duplicated];
          const next = [...prev];
          next.splice(idx + 1, 0, duplicated);
          return next;
        });
        setActiveNoteId(copyId);
        setPreviewMode(false);
      };

      const moveNote = (direction) => {
        const fromIdx = notes.findIndex((n) => n.id === activeNote.id);
        if (fromIdx === -1) return;
        const toIdx = direction === "left" ? fromIdx - 1 : fromIdx + 1;
        if (toIdx < 0 || toIdx >= notes.length) return;
        setNotes((prev) => {
          const next = [...prev];
          const [item] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, item);
          return next;
        });
      };

      const deleteNote = (id) => {
        if (notes.length <= 1) return;
        const filtered = notes.filter((n) => n.id !== id);
        setNotes(filtered);
        if (activeNoteId === id) setActiveNoteId(filtered[0].id);
      };

      const insertSnippet = (snippet) => {
        const current = activeNote?.content || "";
        updateNoteContent(current ? `${current}\n${snippet}` : snippet);
      };

      const copyRoomLink = () => {
        navigator.clipboard?.writeText(window.location.href);
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const exportMarkdown = () => {
        const blob = new Blob([`# ${activeNote.title}\n\n${activeNote.content}`], { type: "text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${(activeNote.title || "note").toLowerCase().replace(/\s+/g, "-")}.md`;
        a.click();
      };

      const generateFreshRoomCode = async (currentCode, maxAttempts = 25) => {
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const candidate = generateRoomCode();
          if (candidate === currentCode) continue;
          if (isLocalRoomUtilised(candidate)) continue;

          if (window.__syncpadCloud?.enabled && typeof window.__syncpadCloud.isRoomUtilised === "function") {
            const utilisedInCloud = await window.__syncpadCloud.isRoomUtilised(candidate);
            if (utilisedInCloud) continue;
          }

          return candidate;
        }
        return generateRoomCode();
      };

      const handleNewRoom = async () => {
        if (isGeneratingRoom) return;
        setIsGeneratingRoom(true);
        try {
          const freshCode = await generateFreshRoomCode(roomCode);
          setConfirmClear(false);
          setSelectedId(null);
          setCanvasModal(null);
          setHistory([]);
          setRedoStack([]);
          setRoomCode(freshCode);
          setRoomInput(freshCode);
        } finally {
          setIsGeneratingRoom(false);
        }
      };

      const handleClearRoom = async () => {
        if (!confirmClear) {
          setConfirmClear(true);
          setTimeout(() => setConfirmClear(false), 3000);
          return;
        }

        const freshNoteId = `note-${Date.now()}`;
        const cleanNotes = [{ id: freshNoteId, title: "Shared Scratchpad", content: "" }];
        const cleanElements = [];
        const ts = Date.now();

        setConfirmClear(false);
        setSelectedId(null);
        setCanvasModal(null);
        setHistory([]);
        setRedoStack([]);
        fillImageCacheRef.current.clear();

        isApplyingRemoteRef.current = true;
        setNotes(cleanNotes);
        setActiveNoteId(freshNoteId);
        setElements(cleanElements);
        setTimeout(() => {
          isApplyingRemoteRef.current = false;
        }, 60);

        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify({
              notes: cleanNotes,
              elements: cleanElements,
              activeNoteId: freshNoteId,
              updatedAt: ts
            })
          );
        } catch (err) {
          console.error("Local clear error:", err);
        }

        if (window.__syncpadCloud?.enabled) {
          try {
            lastWrittenAtRef.current = ts;
            await window.__syncpadCloud.saveRoom(roomCode, {
              notes: cleanNotes,
              elements: cleanElements,
              activeNoteId: freshNoteId,
              updatedAt: ts
            });
            setSyncStatus("Room cleared");
          } catch (err) {
            console.error("Firebase clear error:", err);
            setSyncStatus("Sync error (check rules)");
          }
        }
      };

      const commitCanvasModal = (e) => {
        if (e) e.preventDefault();
        if (!canvasModal) return;

        const trimmed = canvasModal.value.trim();
        if (trimmed) {
          const newItem =
            canvasModal.type === "text"
              ? {
                  id: Date.now(),
                  type: "text",
                  x: canvasModal.x,
                  y: canvasModal.y,
                  text: trimmed,
                  color,
                  fontSize: strokeSize * 4 + 10
                }
              : {
                  id: Date.now(),
                  type: "sticky",
                  x: canvasModal.x,
                  y: canvasModal.y,
                  text: trimmed
                };

          setRedoStack([]);
          setElements((prev) => {
            setHistory((h) => [...h, prev]);
            return [...prev, newItem];
          });
        }
        setCanvasModal(null);
      };

      const screenToWorld = (clientX, clientY) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const { panX, panY, zoom } = viewportRef.current;
        return {
          x: round1((sx - panX) / zoom),
          y: round1((sy - panY) / zoom)
        };
      };

      const drawSingleElement = useCallback((ctx, el, renderFillImages = true) => {
        ctx.save();
        if (el.type === "fill" && el.dataUrl) {
          if (renderFillImages) {
            let img = fillImageCacheRef.current.get(el.id);
            if (!img) {
              img = new Image();
              img.src = el.dataUrl;
              img.onload = () => renderCanvas();
              fillImageCacheRef.current.set(el.id, img);
            }
            if (img.complete && img.naturalWidth > 0) {
              ctx.drawImage(img, 0, 0, BOARD_WIDTH, BOARD_HEIGHT);
            }
          }
        } else if (el.type === "stroke" && Array.isArray(el.points)) {
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = el.tool === "eraser" ? "#0f172a" : el.color;
          ctx.globalAlpha = el.tool === "highlighter" ? 0.35 : 1;
          ctx.lineWidth = el.tool === "highlighter" ? el.size * 4 : el.tool === "eraser" ? el.size * 6 : el.size;
          ctx.beginPath();
          if (el.points.length === 1) {
            ctx.arc(el.points[0].x, el.points[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.fill();
          } else {
            el.points.forEach((pt, idx) => {
              if (idx === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
          }
        } else if (el.type === "line") {
          ctx.lineCap = "round";
          ctx.strokeStyle = el.color;
          ctx.lineWidth = el.size;
          ctx.beginPath();
          ctx.moveTo(el.x1, el.y1);
          ctx.lineTo(el.x2, el.y2);
          ctx.stroke();
        } else if (el.type === "arrow") {
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = el.color;
          ctx.lineWidth = el.size;
          ctx.beginPath();
          ctx.moveTo(el.x1, el.y1);
          ctx.lineTo(el.x2, el.y2);
          ctx.stroke();
          drawArrowHead(ctx, el.x1, el.y1, el.x2, el.y2, el.size);
        } else if (el.type === "rect") {
          ctx.lineWidth = el.size;
          if (el.filled) {
            ctx.fillStyle = el.color;
            ctx.fillRect(el.x, el.y, el.w, el.h);
          }
          ctx.strokeStyle = el.color;
          ctx.strokeRect(el.x, el.y, el.w, el.h);
        } else if (el.type === "ellipse") {
          const cx = el.x + el.w / 2;
          const cy = el.y + el.h / 2;
          const rx = Math.abs(el.w / 2);
          const ry = Math.abs(el.h / 2);
          ctx.lineWidth = el.size;
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
          if (el.filled) {
            ctx.fillStyle = el.color;
            ctx.fill();
          }
          ctx.strokeStyle = el.color;
          ctx.stroke();
        } else if (el.type === "sticky") {
          ctx.fillStyle = "#fef08a";
          ctx.fillRect(el.x, el.y, 150, 100);
          ctx.strokeStyle = "#eab308";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(el.x, el.y, 150, 100);
          ctx.fillStyle = "#1e293b";
          ctx.font = "13px sans-serif";
          ctx.fillText(el.text || "Note", el.x + 10, el.y + 24, 130);
        } else if (el.type === "card") {
          const w = el.w || 220;
          const h = el.h || 120;
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(el.x, el.y, w, h);
          ctx.strokeStyle = el.color || "#38bdf8";
          ctx.lineWidth = 2;
          ctx.strokeRect(el.x, el.y, w, h);

          ctx.fillStyle = el.color || "#38bdf8";
          ctx.font = "bold 14px sans-serif";
          ctx.fillText((el.title || "Note").slice(0, 28), el.x + 12, el.y + 24, w - 24);

          ctx.fillStyle = "#e2e8f0";
          ctx.font = "12px sans-serif";
          const lines = String(el.excerpt || "").split("\n").slice(0, 3);
          lines.forEach((line, idx) => {
            ctx.fillText(line.slice(0, 36), el.x + 12, el.y + 48 + idx * 18, w - 24);
          });
        } else if (el.type === "text") {
          const fontSize = el.fontSize || 18;
          ctx.fillStyle = el.color || "#f8fafc";
          ctx.font = `600 ${fontSize}px sans-serif`;
          ctx.fillText(el.text || "", el.x, el.y);
        }
        ctx.restore();
      }, []);

      const renderCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
          canvas.width = Math.floor(rect.width * dpr);
          canvas.height = Math.floor(rect.height * dpr);
        }

        const { panX, panY, zoom } = viewportRef.current;

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, rect.width, rect.height);

        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
        ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
        ctx.lineWidth = 1.5 / zoom;
        ctx.strokeRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);

        ctx.fillStyle = "rgba(148, 163, 184, 0.16)";
        const step = 28;
        for (let x = step; x < BOARD_WIDTH; x += step) {
          for (let y = step; y < BOARD_HEIGHT; y += step) {
            ctx.fillRect(x, y, 1.5, 1.5);
          }
        }

        const all = draftElementRef.current ? [...elements, draftElementRef.current] : elements;
        for (const el of all) {
          drawSingleElement(ctx, el, true);
        }

        if (selectedId) {
          const sel = elements.find((item) => item.id === selectedId);
          const b = getElementBounds(sel);
          if (b) {
            ctx.save();
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 1.5 / zoom;
            ctx.setLineDash([5, 4]);
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.restore();
          }
        }

        ctx.restore();
      }, [elements, selectedId, viewMode, zenMode, viewport, drawSingleElement]);

      useEffect(() => {
        renderCanvas();
        window.addEventListener("resize", renderCanvas);
        return () => window.removeEventListener("resize", renderCanvas);
      }, [renderCanvas]);

      const sampleColorAtWorldPoint = (wx, wy) => {
        const ix = Math.floor(wx);
        const iy = Math.floor(wy);
        if (ix < 0 || iy < 0 || ix >= BOARD_WIDTH || iy >= BOARD_HEIGHT) return null;

        const off = document.createElement("canvas");
        off.width = BOARD_WIDTH;
        off.height = BOARD_HEIGHT;
        const offCtx = off.getContext("2d");
        for (const el of elements) {
          if (el.type === "stroke" && el.tool === "eraser") continue;
          drawSingleElement(offCtx, el, true);
        }
        const px = offCtx.getImageData(ix, iy, 1, 1).data;
        if (px[3] < 20) return "#0f172a";
        return rgbToHex(px[0], px[1], px[2]);
      };

      const canPointerDraw = (e) => {
        if (!stylusOnly) return true;
        return e.pointerType === "pen" || e.pointerType === "mouse";
      };

      const startPinchSession = () => {
        const pts = Array.from(activePointersRef.current.values());
        if (pts.length < 2) return;
        const [a, b] = pts;
        const dist = Math.max(10, Math.hypot(b.x - a.x, b.y - a.y));
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2;
        pinchStateRef.current = {
          startDist: dist,
          startZoom: viewportRef.current.zoom,
          startMidX: midX,
          startMidY: midY,
          startPanX: viewportRef.current.panX,
          startPanY: viewportRef.current.panY
        };
      };

      const handlePointerDown = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        activePointersRef.current.set(e.pointerId, { x: sx, y: sy });
        e.currentTarget.setPointerCapture(e.pointerId);

        if (activePointersRef.current.size >= 2) {
          draftElementRef.current = null;
          if (moveStateRef.current) {
            setElements(moveStateRef.current.snapshotBeforeMove);
            moveStateRef.current = null;
          }
          startPinchSession();
          renderCanvas();
          return;
        }

        if (!canPointerDraw(e)) {
          return;
        }

        const pt = screenToWorld(e.clientX, e.clientY);

        if (tool === "eyedropper") {
          const picked = sampleColorAtWorldPoint(pt.x, pt.y);
          if (picked) {
            setColor(picked);
            setTool("pen");
          }
          return;
        }

        if (tool === "select") {
          for (let i = elements.length - 1; i >= 0; i--) {
            if (hitTestElement(elements[i], pt.x, pt.y)) {
              const target = elements[i];
              setSelectedId(target.id);
              moveStateRef.current = {
                id: target.id,
                lastPt: pt,
                snapshotBeforeMove: elements
              };
              return;
            }
          }
          setSelectedId(null);
          return;
        }

        setSelectedId(null);

        if (tool === "fill") {
          const off = document.createElement("canvas");
          off.width = BOARD_WIDTH;
          off.height = BOARD_HEIGHT;
          const offCtx = off.getContext("2d");
          for (const el of elements) {
            drawSingleElement(offCtx, el, true);
          }
          const dataUrl = computeFloodFillDataUrl(off, pt.x, pt.y, color);
          if (dataUrl) {
            setRedoStack([]);
            setElements((prev) => {
              setHistory((h) => [...h, prev]);
              return [...prev, { id: Date.now(), type: "fill", dataUrl, color }];
            });
          }
          return;
        }

        if (tool === "text" || tool === "sticky") {
          setCanvasModal({
            type: tool,
            x: pt.x,
            y: pt.y,
            value: ""
          });
          return;
        }

        if (tool === "line" || tool === "arrow") {
          draftElementRef.current = {
            id: Date.now(),
            type: tool,
            x1: pt.x,
            y1: pt.y,
            x2: pt.x,
            y2: pt.y,
            color,
            size: strokeSize
          };
        } else if (tool === "rect" || tool === "ellipse") {
          draftElementRef.current = {
            id: Date.now(),
            type: tool,
            x: pt.x,
            y: pt.y,
            w: 0,
            h: 0,
            color,
            size: strokeSize,
            filled: fillShape
          };
        } else {
          draftElementRef.current = { id: Date.now(), type: "stroke", tool, color, size: strokeSize, points: [pt] };
        }
        renderCanvas();
      };

      const handlePointerMove = (e) => {
        if (!activePointersRef.current.has(e.pointerId)) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        activePointersRef.current.set(e.pointerId, { x: sx, y: sy });

        if (activePointersRef.current.size >= 2) {
          if (!pinchStateRef.current) {
            startPinchSession();
          }
          const pts = Array.from(activePointersRef.current.values());
          const [a, b] = pts;
          const dist = Math.max(10, Math.hypot(b.x - a.x, b.y - a.y));
          const midX = (a.x + b.x) / 2;
          const midY = (a.y + b.y) / 2;
          const ps = pinchStateRef.current;

          const nextZoom = clamp(round1(ps.startZoom * (dist / ps.startDist)), MIN_ZOOM, MAX_ZOOM);
          const worldAnchorX = (ps.startMidX - ps.startPanX) / ps.startZoom;
          const worldAnchorY = (ps.startMidY - ps.startPanY) / ps.startZoom;
          const nextPanX = round1(midX - worldAnchorX * nextZoom);
          const nextPanY = round1(midY - worldAnchorY * nextZoom);

          setViewport({ panX: nextPanX, panY: nextPanY, zoom: nextZoom });
          return;
        }

        if (!canPointerDraw(e)) {
          return;
        }

        const pt = screenToWorld(e.clientX, e.clientY);

        if (moveStateRef.current) {
          const dx = pt.x - moveStateRef.current.lastPt.x;
          const dy = pt.y - moveStateRef.current.lastPt.y;
          if (Math.abs(dx) >= 0.5 || Math.abs(dy) >= 0.5) {
            moveStateRef.current.lastPt = pt;
            const targetId = moveStateRef.current.id;
            setElements((prev) => prev.map((el) => (el.id === targetId ? translateElement(el, dx, dy) : el)));
          }
          return;
        }

        const draft = draftElementRef.current;
        if (!draft) return;

        if (draft.type === "stroke") {
          const lastPt = draft.points[draft.points.length - 1];
          if (shouldKeepPoint(lastPt, pt, 3)) {
            draft.points.push(pt);
            renderCanvas();
          }
        } else if (draft.type === "line" || draft.type === "arrow") {
          draft.x2 = pt.x;
          draft.y2 = pt.y;
          renderCanvas();
        } else if (draft.type === "rect" || draft.type === "ellipse") {
          draft.w = round1(pt.x - draft.x);
          draft.h = round1(pt.y - draft.y);
          renderCanvas();
        }
      };

      const handlePointerUpOrCancel = (e) => {
        activePointersRef.current.delete(e.pointerId);
        if (activePointersRef.current.size < 2) {
          pinchStateRef.current = null;
        }
        if (activePointersRef.current.size > 0) {
          return;
        }

        if (moveStateRef.current) {
          const before = moveStateRef.current.snapshotBeforeMove;
          moveStateRef.current = null;
          setHistory((h) => [...h, before]);
          setRedoStack([]);
          return;
        }

        const draft = draftElementRef.current;
        if (!draft) return;
        draftElementRef.current = null;

        if (draft.type === "stroke" && draft.points.length > 2) {
          draft.points = simplifyPoints(draft.points, 2).map((p) => ({
            x: round1(p.x),
            y: round1(p.y)
          }));
        }

        setRedoStack([]);
        setElements((prev) => {
          setHistory((h) => [...h, prev]);
          return [...prev, draft];
        });
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const rect = canvasRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const { panX, panY, zoom } = viewportRef.current;
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        const nextZoom = clamp(round1(zoom * factor), MIN_ZOOM, MAX_ZOOM);
        const worldX = (sx - panX) / zoom;
        const worldY = (sy - panY) / zoom;
        setViewport({
          panX: round1(sx - worldX * nextZoom),
          panY: round1(sy - worldY * nextZoom),
          zoom: nextZoom
        });
      };

      const resetViewport = () => {
        setViewport({ panX: 24, panY: 24, zoom: 1 });
      };

      const handleFitToBoard = () => {
        const rect = canvasRef.current?.getBoundingClientRect();
        if (!rect || rect.width <= 0 || rect.height <= 0) {
          resetViewport();
          return;
        }

        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const el of elements) {
          const b = getElementBounds(el);
          if (!b) continue;
          if (b.x < minX) minX = b.x;
          if (b.y < minY) minY = b.y;
          if (b.x + b.w > maxX) maxX = b.x + b.w;
          if (b.y + b.h > maxY) maxY = b.y + b.h;
        }

        const hasContent = Number.isFinite(minX) && maxX > minX && maxY > minY;
        const boxX = hasContent ? minX : 0;
        const boxY = hasContent ? minY : 0;
        const boxW = hasContent ? maxX - minX : BOARD_WIDTH;
        const boxH = hasContent ? maxY - minY : BOARD_HEIGHT;

        const pad = 48;
        const availW = Math.max(100, rect.width - pad * 2);
        const availH = Math.max(100, rect.height - pad * 2);
        const nextZoom = clamp(round1(Math.min(availW / boxW, availH / boxH)), MIN_ZOOM, 1.5);

        const boxCenterX = boxX + boxW / 2;
        const boxCenterY = boxY + boxH / 2;
        const nextPanX = round1(rect.width / 2 - boxCenterX * nextZoom);
        const nextPanY = round1(rect.height / 2 - boxCenterY * nextZoom);

        setViewport({ panX: nextPanX, panY: nextPanY, zoom: nextZoom });
      };

      const handlePinNoteToBoard = () => {
        if (!activeNote) return;
        const rect = canvasRef.current?.getBoundingClientRect();
        const { panX, panY, zoom } = viewportRef.current;

        const centerScreenX = rect ? rect.width / 2 : 300;
        const centerScreenY = rect ? rect.height / 2 : 220;
        const offsetIndex = elements.filter((el) => el.type === "card").length % 6;

        const worldX = clamp(
          round1((centerScreenX - panX) / zoom - 110 + offsetIndex * 24),
          40,
          BOARD_WIDTH - 260
        );
        const worldY = clamp(
          round1((centerScreenY - panY) / zoom - 60 + offsetIndex * 24),
          40,
          BOARD_HEIGHT - 160
        );

        const cleanExcerpt = String(activeNote.content || "")
          .replace(/^#+\s*/gm, "")
          .trim();

        const newCard = {
          id: `card-${Date.now()}`,
          type: "card",
          x: worldX,
          y: worldY,
          w: 220,
          h: 120,
          color,
          title: activeNote.title || "Untitled Note",
          excerpt: cleanExcerpt
        };

        setRedoStack([]);
        setElements((prev) => {
          setHistory((h) => [...h, prev]);
          return [...prev, newCard];
        });
        setSelectedId(newCard.id);
      };

      const deleteSelectedElement = () => {
        if (!selectedId) return;
        setRedoStack([]);
        setElements((prev) => {
          setHistory((h) => [...h, prev]);
          return prev.filter((el) => el.id !== selectedId);
        });
        setSelectedId(null);
      };

      const handleUndo = () => {
        if (history.length === 0) return;
        const previous = history[history.length - 1];
        setRedoStack((r) => [...r, elements]);
        setHistory((h) => h.slice(0, -1));
        setElements(previous);
        setSelectedId(null);
      };

      const handleRedo = () => {
        if (redoStack.length === 0) return;
        const next = redoStack[redoStack.length - 1];
        setHistory((h) => [...h, elements]);
        setRedoStack((r) => r.slice(0, -1));
        setElements(next);
        setSelectedId(null);
      };

      const exportPNG = () => {
        const off = document.createElement("canvas");
        off.width = BOARD_WIDTH;
        off.height = BOARD_HEIGHT;
        const offCtx = off.getContext("2d");
        offCtx.fillStyle = "#0f172a";
        offCtx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
        for (const el of elements) {
          drawSingleElement(offCtx, el, true);
        }
        const a = document.createElement("a");
        a.href = off.toDataURL("image/png");
        a.download = `syncpad-${roomCode}-board.png`;
        a.click();
      };

      const handleRoomSubmit = (e) => {
        e.preventDefault();
        const cleaned = roomInput.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "").slice(0, 12);
        if (cleaned) {
          setRoomCode(cleaned);
          setRoomInput(cleaned);
        }
      };

      const isShapeTool = tool === "rect" || tool === "ellipse";
      const hasCustomColor = !COLORS.includes(color);

      return (
        <div className="flex flex-col h-full bg-slate-950 text-slate-100 select-none">
          {!zenMode && (
            <header className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-slate-900 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="font-bold tracking-tight text-sky-400 text-base">SyncPad</span>
                <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                  {syncStatus}
                </span>
                <span
                  className="inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-200 border border-slate-700"
                  title="Active devices currently viewing this room"
                >
                  <span className={`w-2 h-2 rounded-full ${activeDevices > 1 ? "bg-sky-400 animate-pulse" : "bg-emerald-400"}`} />
                  {activeDevices} {activeDevices === 1 ? "device" : "devices"}
                </span>
              </div>

              <form onSubmit={handleRoomSubmit} className="flex items-center gap-1.5">
                <span className="text-xs text-slate-400">Room:</span>
                <input
                  value={roomInput}
                  onChange={(e) => setRoomInput(e.target.value.toUpperCase())}
                  className="w-24 px-2 py-1 text-xs font-mono uppercase bg-slate-800 border border-slate-700 rounded text-white focus:outline-none focus:border-sky-400"
                  aria-label="Room Code"
                />
                <button type="submit" className="px-2.5 py-1 text-xs font-medium bg-sky-500 hover:bg-sky-400 text-slate-950 rounded min-h-[34px]">
                  Join
                </button>
                <button
                  type="button"
                  onClick={handleNewRoom}
                  disabled={isGeneratingRoom}
                  className="px-2.5 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-sky-300 border border-slate-700 rounded min-h-[34px]"
                  title="Generate a fresh unused room code"
                >
                  {isGeneratingRoom ? "Finding..." : "New"}
                </button>
                <button
                  type="button"
                  onClick={handleClearRoom}
                  className={`px-2.5 py-1 text-xs font-medium rounded min-h-[34px] border ${
                    confirmClear
                      ? "bg-rose-600 text-white border-rose-400"
                      : "bg-slate-800 hover:bg-rose-950/70 text-rose-300 border-slate-700"
                  }`}
                  title="Tap twice to clear current room notes and board"
                >
                  {confirmClear ? "Confirm Clear?" : "Clear Room"}
                </button>
                <button
                  type="button"
                  onClick={copyRoomLink}
                  className="flex items-center gap-1 px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded min-h-[34px]"
                  title="Copy Room Link"
                >
                  <Icon "check" "share"} : ? className="w-3.5 h-3.5 text-sky-400" name="{copied"/>
                  <span>{copied ? "Copied" : "Link"}</span>
                </button>
              </form>

              <div className="hidden md:flex items-center bg-slate-800 p-0.5 rounded-lg border border-slate-700">
                <button
                  type="button"
                  onClick={() => setViewMode("notes")}
                  className={`flex items-center gap-1 px-3 py-1.5 text-xs rounded-md ${viewMode === "notes" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
                >
                  <Icon className="w-3.5 h-3.5" name="fileText"/> Notes
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode("split")}
                  className={`flex items-center gap-1 px-3 py-1.5 text-xs rounded-md ${viewMode === "split" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
                >
                  <Icon className="w-3.5 h-3.5" name="columns"/> Split
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode("whiteboard")}
                  className={`flex items-center gap-1 px-3 py-1.5 text-xs rounded-md ${viewMode === "whiteboard" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
                >
                  <Icon className="w-3.5 h-3.5" name="penTool"/> Board
                </button>
              </div>
            </header>
          )}

          <main className="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">
            {!zenMode && (viewMode === "notes" || viewMode === "split") && (
              <section className={`flex flex-col min-h-0 bg-slate-900/60 border-b md:border-b-0 md:border-r border-slate-800 ${viewMode === "split" ? "h-1/2 md:h-full md:w-5/12" : "flex-1"}`}>
                <div className="flex items-center gap-1.5 px-2 py-1.5 bg-slate-900 border-b border-slate-800 overflow-x-auto no-scrollbar">
                  {notes.map((n) => (
                    <div
                      key={n.id}
                      onClick={() => setActiveNoteId(n.id)}
                      className={`group flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs cursor-pointer shrink-0 min-h-[36px] ${
                        n.id === activeNote.id ? "bg-slate-800 text-sky-300 border border-sky-500/40" : "text-slate-400 hover:bg-slate-800/50"
                      }`}
                    >
                      <span className="truncate max-w-[120px]">{n.title || "Untitled"}</span>
                      {notes.length > 1 && (
                        <button
                          type="button"
                          onClick={(e) => { e.stopPropagation(); deleteNote(n.id); }}
                          className="opacity-70 hover:opacity-100 text-rose-400 px-1"
                          title="Delete note"
                        >
                          ×
                        </button>
                      )}
                    </div>
                  ))}
                  <button type="button" onClick={addNote} className="p-2 text-slate-400 hover:text-sky-400 rounded-lg min-w-[36px] min-h-[36px] flex items-center justify-center" title="New Note">
                    <Icon className="w-4 h-4" name="plus"/>
                  </button>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-1.5 px-2 py-1.5 bg-slate-900/80 border-b border-slate-800 text-xs">
                  <div className="flex items-center gap-1 overflow-x-auto no-scrollbar">
                    <button
                      type="button"
                      onClick={() => setPreviewMode((p) => !p)}
                      className={`px-2.5 py-1.5 rounded min-h-[34px] font-medium border ${
                        previewMode
                          ? "bg-sky-500 text-slate-950 border-sky-400"
                          : "bg-slate-800 hover:bg-slate-700 text-sky-300 border-slate-700"
                      }`}
                      title="Toggle live Markdown preview"
                    >
                      {previewMode ? "Edit" : "Preview"}
                    </button>
                    <button
                      type="button"
                      onClick={() => duplicateNote(activeNote.id)}
                      className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded min-h-[34px] text-slate-200"
                      title="Duplicate current note"
                    >
                      Duplicate
                    </button>
                    <button
                      type="button"
                      onClick={() => moveNote("left")}
                      disabled={resolvedIndex <= 0}
                      className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded min-h-[34px]"
                      title="Move note tab left"
                      aria-label="Move note left"
                    >
                      ←
                    </button>
                    <button
                      type="button"
                      onClick={() => moveNote("right")}
                      disabled={resolvedIndex >= notes.length - 1}
                      className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 rounded min-h-[34px]"
                      title="Move note tab right"
                      aria-label="Move note right"
                    >
                      →
                    </button>
                    <button
                      type="button"
                      onClick={handlePinNoteToBoard}
                      className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 rounded min-h-[34px] font-medium"
                      title="Pin active note as a card on the whiteboard"
                    >
                      Pin to Board
                    </button>
                    {!previewMode && (
                      <>
                        <button type="button" onClick={() => insertSnippet("## Heading")} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded min-h-[34px]">H2</button>
                        <button type="button" onClick={() => insertSnippet("- [ ] Task item")} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded min-h-[34px]">Checklist</button>
                        <button type="button" onClick={() => insertSnippet("**bold text**")} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded font-bold min-h-[34px]">B</button>
                        <button type="button" onClick={() => insertSnippet("```\ncode\n```")} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded font-mono min-h-[34px]">Code</button>
                      </>
                    )}
                  </div>

                  <div className="flex items-center gap-1">
                    <button type="button" onClick={() => navigator.clipboard?.writeText(activeNote.content)} className="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 min-h-[34px]">
                      <Icon name="copy" className="w-3.5 h-3.5" /> Copy
                    </button>
                    <button type="button" onClick={exportMarkdown} className="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 min-h-[34px]">
                      <Icon name="download" className="w-3.5 h-3.5" /> .MD
                    </button>
                  </div>
                </div>

                <input
                  value={activeNote.title}
                  onChange={(e) => updateNoteTitle(e.target.value)}
                  placeholder="Edit note title anytime..."
                  className="px-3 py-2 bg-transparent border-b border-slate-800/80 font-semibold text-sm text-white focus:outline-none"
                />

                {previewMode ? (
                  <div
                    className="flex-1 w-full p-3 overflow-y-auto text-sm bg-slate-950/40 select-text"
                    dangerouslySetInnerHTML={{ __html: renderMarkdownHtml(activeNote.content) }}
                  />
                ) : (
                  <textarea
                    value={activeNote.content}
                    onChange={(e) => updateNoteContent(e.target.value)}
                    placeholder="Type or edit note text anytime..."
                    className="flex-1 w-full p-3 bg-transparent text-sm text-slate-100 leading-relaxed resize-none focus:outline-none select-text"
                  />
                )}
              </section>
            )}

            {(zenMode || viewMode === "whiteboard" || viewMode === "split") && (
              <section
                className={`flex flex-col min-h-0 bg-slate-950 ${
                  zenMode
                    ? "fixed inset-0 z-40 w-full h-full"
                    : viewMode === "split"
                      ? "h-1/2 md:h-full md:w-7/12"
                      : "flex-1"
                }`}
              >
                <div className="flex flex-col gap-1.5 px-2.5 py-2 bg-slate-900 border-b border-slate-800">
                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    {[
                      { id: "select", icon: "cursor", title: "Select & Move" },
                      { id: "pen", icon: "penTool", title: "Pen" },
                      { id: "highlighter", icon: "highlighter", title: "Highlighter" },
                      { id: "eraser", icon: "eraser", title: "Eraser" },
                      { id: "fill", icon: "bucket", title: "Flood Fill" },
                      { id: "eyedropper", icon: "eyedropper", title: "Eyedropper" },
                      { id: "line", icon: "line", title: "Line" },
                      { id: "arrow", icon: "arrow", title: "Arrow" },
                      { id: "rect", icon: "square", title: "Rectangle" },
                      { id: "ellipse", icon: "circle", title: "Ellipse" },
                      { id: "text", icon: "textType", title: "Text" },
                      { id: "sticky", icon: "sticky", title: "Sticky Note" }
                    ].map((t) => (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => setTool(t.id)}
                        title={t.title}
                        aria-label={t.title}
                        className={`p-2 rounded-lg shrink-0 min-w-[40px] min-h-[40px] flex items-center justify-center ${
                          tool === t.id ? "bg-sky-500 text-slate-950 shadow-sm" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        <Icon name={t.icon} className="w-4 h-4" />
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-1.5">
                      {COLORS.map((c) => (
                        <button
                          key={c}
                          type="button"
                          onClick={() => setColor(c)}
                          style={{ backgroundColor: c }}
                          className={`w-7 h-7 rounded-full border-2 ${color === c ? "border-white scale-110" : "border-slate-700"}`}
                          aria-label={`Color ${c}`}
                        />
                      ))}
                      {hasCustomColor && (
                        <span
                          style={{ backgroundColor: color }}
                          className="w-7 h-7 rounded-full border-2 border-white ring-2 ring-sky-400/60"
                          title={`Sampled color: ${color}`}
                        />
                      )}
                      {isShapeTool && (
                        <button
                          type="button"
                          onClick={() => setFillShape((f) => !f)}
                          className={`ml-1 px-2.5 py-1 rounded text-xs font-medium border ${
                            fillShape
                              ? "bg-sky-500/20 text-sky-300 border-sky-400"
                              : "bg-slate-800 text-slate-300 border-slate-700"
                          }`}
                        >
                          {fillShape ? "Filled" : "Outline"}
                        </button>
                      )}
                    </div>

                    <div className="flex flex-wrap items-center gap-1">
                      {SIZE_PRESETS.map((p) => (
                        <button
                          key={p.label}
                          type="button"
                          onClick={() => setStrokeSize(p.value)}
                          className={`px-2 py-1 rounded text-xs font-semibold min-h-[32px] ${
                            strokeSize === p.value ? "bg-sky-500 text-slate-950" : "bg-slate-800 text-slate-300"
                          }`}
                          title={`Size ${p.label}`}
                        >
                          {p.label}
                        </button>
                      ))}

                      <button
                        type="button"
                        onClick={resetViewport}
                        className="px-2 py-1 rounded text-xs font-mono bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 min-h-[32px]"
                        title="Reset Pan & Zoom to 100%"
                      >
                        {Math.round(viewport.zoom * 100)}%
                      </button>

                      <button
                        type="button"
                        onClick={handleFitToBoard}
                        className="px-2 py-1 rounded text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 min-h-[32px]"
                        title="Fit content or full 2000x1400 workspace into view"
                      >
                        Fit
                      </button>

                      <button
                        type="button"
                        onClick={() => setStylusOnly((s) => !s)}
                        className={`px-2 py-1 rounded text-xs font-medium border min-h-[32px] ${
                          stylusOnly
                            ? "bg-amber-500/20 text-amber-300 border-amber-400"
                            : "bg-slate-800 text-slate-300 border-slate-700"
                        }`}
                        title="When ON, fingers only pan/zoom while stylus or mouse draws"
                      >
                        {stylusOnly ? "Pen Only" : "Touch+Pen"}
                      </button>

                      <button
                        type="button"
                        onClick={() => setZenMode((z) => !z)}
                        className={`px-2 py-1 rounded text-xs font-medium border min-h-[32px] ${
                          zenMode
                            ? "bg-sky-500 text-slate-950 border-sky-400 font-semibold"
                            : "bg-slate-800 text-slate-300 border-slate-700"
                        }`}
                        title="Maximize canvas by hiding header and notes"
                      >
                        {zenMode ? "Exit Zen" : "Zen"}
                      </button>

                      {selectedId && (
                        <button
                          type="button"
                          onClick={deleteSelectedElement}
                          className="px-2.5 py-1 text-xs font-medium bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 rounded min-h-[32px]"
                          title="Delete Selected"
                        >
                          Delete
                        </button>
                      )}

                      <button type="button" onClick={handleUndo} disabled={history.length === 0} className="p-2 bg-slate-800 disabled:opacity-30 rounded-lg min-w-[36px] min-h-[36px] flex items-center justify-center" title="Undo">
                        <Icon name="undo" className="w-4 h-4" />
                      </button>
                      <button type="button" onClick={handleRedo} disabled={redoStack.length === 0} className="p-2 bg-slate-800 disabled:opacity-30 rounded-lg min-w-[36px] min-h-[36px] flex items-center justify-center" title="Redo">
                        <Icon name="redo" className="w-4 h-4" />
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setRedoStack([]);
                          setElements((prev) => {
                            setHistory((h) => [...h, prev]);
                            return [];
                          });
                          setSelectedId(null);
                          fillImageCacheRef.current.clear();
                        }}
                        className="p-2 bg-slate-800 hover:bg-rose-950 text-rose-400 rounded-lg min-w-[36px] min-h-[36px] flex items-center justify-center"
                        title="Clear Board"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                      <button
                        type="button"
                        onClick={exportPNG}
                        className="flex items-center gap-1 px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg min-h-[36px]"
                        title="Export PNG"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" /> PNG
                      </button>
                    </div>
                  </div>
                </div>

                <div className="relative flex-1 min-h-0">
                  {zenMode && (
                    <button
                      type="button"
                      onClick={() => setZenMode(false)}
                      className="fixed top-3 right-3 z-50 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900/90 hover:bg-slate-800 text-sky-300 border border-sky-500/40 shadow-lg min-h-[38px]"
                    >
                      Exit Zen
                    </button>
                  )}

                  {canvasModal && (
                    <div
                      className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 px-4"
                      onPointerDown={(e) => {
                        if (e.target === e.currentTarget) setCanvasModal(null);
                      }}
                    >
                      <form
                        onSubmit={commitCanvasModal}
                        className="w-full max-w-sm rounded-xl bg-slate-900 border border-slate-700 p-4 shadow-2xl flex flex-col gap-3"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-sm font-semibold text-sky-300">
                            {canvasModal.type === "text" ? "Add Canvas Text" : "Add Sticky Note"}
                          </span>
                          <button
                            type="button"
                            onClick={() => setCanvasModal(null)}
                            className="text-slate-400 hover:text-white px-2 py-1 text-base leading-none min-h-[34px]"
                            aria-label="Close"
                          >
                            ×
                          </button>
                        </div>

                        <input
                          ref={canvasModalInputRef}
                          type="text"
                          value={canvasModal.value}
                          onChange={(e) => setCanvasModal((prev) => (prev ? { ...prev, value: e.target.value } : null))}
                          onKeyDown={(e) => {
                            if (e.key === "Escape") setCanvasModal(null);
                          }}
                          placeholder={canvasModal.type === "text" ? "Type label text..." : "Type sticky note..."}
                          className="w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-400 select-text"
                        />

                        <div className="flex items-center justify-end gap-2">
                          <button
                            type="button"
                            onClick={() => setCanvasModal(null)}
                            className="px-3.5 py-2 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 min-h-[38px]"
                          >
                            Cancel
                          </button>
                          <button
                            type="submit"
                            className="px-4 py-2 rounded-lg text-xs font-semibold bg-sky-500 hover:bg-sky-400 text-slate-950 min-h-[38px]"
                          >
                            {canvasModal.type === "text" ? "Place Text" : "Place Sticky"}
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  <canvas
                    ref={canvasRef}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUpOrCancel}
                    onPointerCancel={handlePointerUpOrCancel}
                    onWheel={handleWheel}
                    style={{ touchAction: "none" }}
                    className={`w-full h-full block ${tool === "select" ? "cursor-grab active:cursor-grabbing" : "cursor-crosshair"}`}
                  />
                </div>
              </section>
            )}
          </main>

          {!zenMode && (
            <nav className="flex md:hidden items-center justify-around py-1.5 bg-slate-900 border-t border-slate-800 text-xs">
              <button
                type="button"
                onClick={() => setViewMode("notes")}
                className={`flex items-center gap-1.5 px-4 py-2 rounded-lg min-h-[40px] ${viewMode === "notes" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
              >
                <Icon name="fileText" className="w-4 h-4" /> Notes
              </button>
              <button
                type="button"
                onClick={() => setViewMode("split")}
                className={`flex items-center gap-1.5 px-4 py-2 rounded-lg min-h-[40px] ${viewMode === "split" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
              >
                <Icon name="columns" className="w-4 h-4" /> Split
              </button>
              <button
                type="button"
                onClick={() => setViewMode("whiteboard")}
                className={`flex items-center gap-1.5 px-4 py-2 rounded-lg min-h-[40px] ${viewMode === "whiteboard" ? "bg-sky-500 text-slate-950 font-semibold" : "text-slate-300"}`}
              >
                <Icon name="penTool" className="w-4 h-4" /> Board
              </button>
            </nav>
          )}
        </div>
      );
    }

    if (window.React && window.ReactDOM) {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    } else {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#f8fafc'>Unable to load React from CDN. Check if an ad blocker or network filter is blocking jsdelivr/cdnjs.</div>";
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
