  <!-- Firebase Modular SDK Bridge -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      push,
      remove,
      onValue,
      onDisconnect,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBbr-33OjioACO7GJEsgIzLOs9BpZxjeMQ",
      authDomain: "syncpad-cloud.firebaseapp.com",
      databaseURL: "https://syncpad-cloud-default-rtdb.firebaseio.com",
      projectId: "syncpad-cloud",
      storageBucket: "syncpad-cloud.firebasestorage.app",
      messagingSenderId: "959117212033",
      appId: "1:959117212033:web:bf5b73e04949fe59b59080"
    };

    const isConfigured = Boolean(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);

    let db = null;
    if (isConfigured) {
      const app = initializeApp(FIREBASE_CONFIG);
      db = getDatabase(app);
    }

    function hasUtilisedContent(val) {
      if (!val || typeof val !== "object") return false;
      const hasElements = Array.isArray(val.elements) && val.elements.length > 0;
      const notesList = Array.isArray(val.notes)
        ? val.notes
        : val.notes && typeof val.notes === "object"
          ? Object.values(val.notes)
          : [];

      const hasNoteContent = notesList.some((n) => {
        if (!n || typeof n !== "object") return false;
        const body = String(n.content || "").trim();
        const title = String(n.title || "").trim();
        const hasCustomTitle =
          title.length > 0 &&
          title !== "Shared Scratchpad" &&
          !/^Note \d+$/i.test(title);
        return body.length > 0 || hasCustomTitle;
      });

      return hasElements || hasNoteContent;
    }

    window.__syncpadCloud = {
      enabled: isConfigured,
      subscribeRoom(roomCode, callback) {
        if (!db) return () => {};
        const roomRef = ref(db, `rooms/${roomCode}`); return onValue( roomRef, (snapshot) => { const val = snapshot.val(); if (val) callback(val); }, (err) => { console.error("Firebase read error:", err); } ); }, async saveRoom(roomCode, payload) { if (!db) return; const roomRef = ref(db, `rooms/${roomCode}`);
        await set(roomRef, payload);
      },
      async isRoomUtilised(roomCode) {
        if (!db) return false;
        try {
          const snap = await get(ref(db, `rooms/${roomCode}`)); if (!snap.exists()) return false; return hasUtilisedContent(snap.val()); } catch (err) { console.warn("Room utilisation check skipped:", err); return false; } }, trackPresence(roomCode, onCountChange) { if (!db) { onCountChange(1); return () => {}; }  const roomPresenceRef = ref(db, `presence/${roomCode}`);
        const myConnRef = push(roomPresenceRef);
        const connectedRef = ref(db, ".info/connected");

        const unsubConnected = onValue(connectedRef, (snap) => {
          if (snap.val() !== true) return;
          onDisconnect(myConnRef)
            .remove()
            .then(() => {
              set(myConnRef, { at: serverTimestamp() });
            })
            .catch((err) => console.warn("Presence onDisconnect error:", err));
        });

        const unsubList = onValue(
          roomPresenceRef,
          (snap) => {
            const val = snap.val();
            const count = val && typeof val === "object" ? Object.keys(val).length : 0;
            onCountChange(Math.max(1, count));
          },
          (err) => {
            console.warn("Presence read error:", err);
            onCountChange(1);
          }
        );

        return () => {
          unsubConnected();
          unsubList();
          remove(myConnRef).catch(() => {});
        };
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const BOARD_WIDTH = 2000;
    const BOARD_HEIGHT = 1400;
    const MIN_ZOOM = 0.4;
    const MAX_ZOOM = 3;

    const COLORS = ["#38bdf8", "#f472b6", "#facc15", "#4ade80", "#f8fafc", "#fb923c"];
    const SIZE_PRESETS = [
      { label: "S", value: 2 },
      { label: "M", value: 4 },
      { label: "L", value: 7 },
      { label: "XL", value: 12 }
    ];

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function round1(n) {
      return Math.round(n * 10) / 10;
    }

    function rgbToHex(r, g, b) {
      return (
        "#" +
        [r, g, b]
          .map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0"))
          .join("")
      );
    }

    function shouldKeepPoint(prevPt, nextPt, minDist = 3) {
      if (!prevPt) return true;
      const dx = nextPt.x - prevPt.x;
      const dy = nextPt.y - prevPt.y;
      return dx * dx + dy * dy >= minDist * minDist;
    }

    function perpendicularDistance(pt, lineStart, lineEnd) {
      const dx = lineEnd.x - lineStart.x;
      const dy = lineEnd.y - lineStart.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) {
        return Math.hypot(pt.x - lineStart.x, pt.y - lineStart.y);
      }
      const t = Math.max(0, Math.min(1, ((pt.x - lineStart.x) * dx + (pt.y - lineStart.y) * dy) / lenSq));
      const projX = lineStart.x + t * dx;
      const projY = lineStart.y + t * dy;
      return Math.hypot(pt.x - projX, pt.y - projY);
    }

    function simplifyPoints(points, epsilon = 2) {
      if (!Array.isArray(points) || points.length <= 2) return points || [];

      let maxDist = 0;
      let index = 0;
      const start = points[0];
      const end = points[points.length - 1];

      for (let i = 1; i < points.length - 1; i++) {
        const d = perpendicularDistance(points[i], start, end);
        if (d > maxDist) {
          maxDist = d;
          index = i;
        }
      }

      if (maxDist > epsilon) {
        const left = simplifyPoints(points.slice(0, index + 1), epsilon);
        const right = simplifyPoints(points.slice(index), epsilon);
        return left.slice(0, -1).concat(right);
      }

      return [start, end];
    }

    function encodeElementForCloud(el) {
      if (el.type === "stroke" && Array.isArray(el.points) && el.points.length > 0) {
        const deltas = [];
        let prevX = round1(el.points[0].x);
        let prevY = round1(el.points[0].y);
        deltas.push(prevX, prevY);

        for (let i = 1; i < el.points.length; i++) {
          const x = round1(el.points[i].x);
          const y = round1(el.points[i].y);
          deltas.push(round1(x - prevX), round1(y - prevY));
          prevX = x;
          prevY = y;
        }

        return {
          id: el.id,
          t: "s",
          m: el.tool === "highlighter" ? "h" : el.tool === "eraser" ? "e" : "p",
          c: el.color,
          w: el.size,
          d: deltas
        };
      }
      return { ...el };
    }

    function decodeElementFromCloud(item) {
      if (!item) return null;
      if (item.t === "s" && Array.isArray(item.d) && item.d.length >= 2) {
        const points = [];
        let curX = item.d[0];
        let curY = item.d[1];
        points.push({ x: curX, y: curY });

        for (let i = 2; i + 1 < item.d.length; i += 2) {
          curX = round1(curX + item.d[i]);
          curY = round1(curY + item.d[i + 1]);
          points.push({ x: curX, y: curY });
        }

        return {
          id: item.id,
          type: "stroke",
          tool: item.m === "h" ? "highlighter" : item.m === "e" ? "eraser" : "pen",
          color: item.c,
          size: item.w,
          points
        };
      }
      return item;
    }

    function hexToRgba(hex, alpha = 255) {
      const clean = (hex || "#38bdf8").replace("#", "");
      const full =
        clean.length === 3
          ? clean.split("").map((ch) => ch + ch).join("")
          : clean.padEnd(6, "0").slice(0, 6);
      const num = parseInt(full, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255, alpha];
    }

    function computeFloodFillDataUrl(sourceCanvas, startX, startY, fillHex) {
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      const sx = Math.floor(startX);
      const sy = Math.floor(startY);
      if (sx < 0 || sy < 0 || sx >= width || sy >= height) return null;

      const srcCtx = sourceCanvas.getContext("2d");
      const srcData = srcCtx.getImageData(0, 0, width, height);
      const pixels = srcData.data;

      const startIdx = (sy * width + sx) * 4;
      const targetR = pixels[startIdx];
      const targetG = pixels[startIdx + 1];
      const targetB = pixels[startIdx + 2];
      const targetA = pixels[startIdx + 3];

      const [fillR, fillG, fillB, fillA] = hexToRgba(fillHex, 255);
      const tol = 28;

      const matchesTarget = (idx) =>
        Math.abs(pixels[idx] - targetR) <= tol &&
        Math.abs(pixels[idx + 1] - targetG) <= tol &&
        Math.abs(pixels[idx + 2] - targetB) <= tol &&
        Math.abs(pixels[idx + 3] - targetA) <= tol;

      if (
        Math.abs(targetR - fillR) <= 4 &&
        Math.abs(targetG - fillG) <= 4 &&
        Math.abs(targetB - fillB) <= 4 &&
        Math.abs(targetA - fillA) <= 4
      ) {
        return null;
      }

      const outCanvas = document.createElement("canvas");
      outCanvas.width = width;
      outCanvas.height = height;
      const outCtx = outCanvas.getContext("2d");
      const outData = outCtx.createImageData(width, height);
      const outPixels = outData.data;

      const visited = new Uint8Array(width * height);
      const stack = [[sx, sy]];
      let changed = 0;

      while (stack.length > 0) {
        let [x, y] = stack.pop();
        let rowOffset = y * width;
        while (x >= 0 && !visited[rowOffset + x] && matchesTarget((rowOffset + x) * 4)) {
          x--;
        }
        x++;

        let spanAbove = false;
        let spanBelow = false;

        while (x < width) {
          const pIdx = rowOffset + x;
          if (visited[pIdx] || !matchesTarget(pIdx * 4)) break;
          visited[pIdx] = 1;

          const idx = pIdx * 4;
          outPixels[idx] = fillR;
          outPixels[idx + 1] = fillG;
          outPixels[idx + 2] = fillB;
          outPixels[idx + 3] = fillA;
          changed++;

          if (y > 0) {
            const aboveP = pIdx - width;
            const aboveMatch = !visited[aboveP] && matchesTarget(aboveP * 4);
            if (!spanAbove && aboveMatch) {
              stack.push([x, y - 1]);
              spanAbove = true;
            } else if (spanAbove && !aboveMatch) {
              spanAbove = false;
            }
          }

          if (y < height - 1) {
            const belowP = pIdx + width;
            const belowMatch = !visited[belowP] && matchesTarget(belowP * 4);
            if (!spanBelow && belowMatch) {
              stack.push([x, y + 1]);
              spanBelow = true;
            } else if (spanBelow && !belowMatch) {
              spanBelow = false;
            }
          }

          x++;
        }
      }

      if (changed === 0) return null;
      outCtx.putImageData(outData, 0, 0);
      return outCanvas.toDataURL("image/png");
    }

    function drawArrowHead(ctx, x1, y1, x2, y2, size) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = Math.max(12, size * 4);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.stroke();
    }

    function getElementBounds(el) {
      if (!el) return null;
      if (el.type === "stroke" && Array.isArray(el.points) && el.points.length > 0) {
        let minX = el.points[0].x,
          maxX = el.points[0].x;
        let minY = el.points[0].y,
          maxY = el.points[0].y;
        for (const p of el.points) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }
        const pad = (el.size || 3) * 2 + 4;
        return { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
      }
      if (el.type === "rect" || el.type === "ellipse") {
        const x1 = Math.min(el.x, el.x + (el.w || 0));
        const y1 = Math.min(el.y, el.y + (el.h || 0));
        const w = Math.abs(el.w || 0);
        const h = Math.abs(el.h || 0);
        return { x: x1 - 4, y: y1 - 4, w: w + 8, h: h + 8 };
      }
      if (el.type === "line" || el.type === "arrow") {
        const x1 = Math.min(el.x1, el.x2);
        const y1 = Math.min(el.y1, el.y2);
        const w = Math.abs(el.x2 - el.x1);
        const h = Math.abs(el.y2 - el.y1);
        return { x: x1 - 8, y: y1 - 8, w: w + 16, h: h + 16 };
      }
      if (el.type === "sticky") {
        return { x: el.x, y: el.y, w: 150, h: 100 };
      }
      if (el.type === "card") {
        return { x: el.x, y: el.y, w: el.w || 220, h: el.h || 120 };
      }
      if (el.type === "text") {
        const fontSize = el.fontSize || 18;
        const estW = Math.max(40, (el.text || "").length * fontSize * 0.58);
        return { x: el.x - 4, y: el.y - fontSize, w: estW + 8, h: fontSize + 10 };
      }
      return null;
    }

    function hitTestElement(el, px, py) {
      if (!el || el.type === "fill") return false;
      const b = getElementBounds(el);
      if (!b) return false;
      return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
    }

    function translateElement(el, dx, dy) {
      const rdx = round1(dx);
      const rdy = round1(dy);
      if (el.type === "stroke" && Array.isArray(el.points)) {
        return {
          ...el,
          points: el.points.map((p) => ({ x: round1(p.x + rdx), y: round1(p.y + rdy) }))
        };
      }
      if (el.type === "line" || el.type === "arrow") {
        return {
          ...el,
          x1: round1(el.x1 + rdx),
          y1: round1(el.y1 + rdy),
          x2: round1(el.x2 + rdx),
          y2: round1(el.y2 + rdy)
        };
      }
      return {
        ...el,
        x: round1((el.x || 0) + rdx),
        y: round1((el.y || 0) + rdy)
      };
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatInlineMarkdown(escapedLine) {
      return escapedLine
        .replace(/`([^`\n]+)`/g, "<code class='px-1.5 py-0.5 rounded bg-slate-800 text-sky-300 font-mono text-xs'>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong class='font-semibold text-white'>$1</strong>");
    }

    function renderMarkdownHtml(mdText) {
      const raw = String(mdText || "");
      if (!raw.trim()) {
        return "<p class='text-slate-500 italic'>Nothing to preview yet. Switch to Edit to add notes.</p>";
      }

      const lines = raw.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inCodeBlock = false;
      let codeLines = [];

      const flushCode = () => {
        if (inCodeBlock) {
          out.push(
            `<pre class="my-2 p-2.5 rounded-lg bg-slate-950 border border-slate-800 overflow-x-auto"><code class="text-xs font-mono text-emerald-300">${escapeHtml(codeLines.join("\n"))}</code></pre>`
          );
          inCodeBlock = false;
          codeLines = [];
        }
      };

      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          if (inCodeBlock) {
            flushCode();
          } else {
            inCodeBlock = true;
            codeLines = [];
          }
          continue;
        }

        if (inCodeBlock) {
          codeLines.push(line);
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) {
          out.push("<div class='h-2'></div>");
          continue;
        }

        if (trimmed.startsWith("### ")) {
          out.push(`<h3 class="text-sm font-bold text-sky-300 mt-2 mb-1">${formatInlineMarkdown(escapeHtml(trimmed.slice(4)))}</h3>`);
        } else if (trimmed.startsWith("## ")) {
          out.push(`<h2 class="text-base font-bold text-sky-300 mt-2.5 mb-1">${formatInlineMarkdown(escapeHtml(trimmed.slice(3)))}</h2>`);
        } else if (trimmed.startsWith("# ")) {
          out.push(`<h1 class="text-lg font-bold text-white mt-2 mb-1.5">${formatInlineMarkdown(escapeHtml(trimmed.slice(2)))}</h1>`);
        } else if (/^- \[x\] /i.test(trimmed)) {
          out.push(
            `<div class="flex items-start gap-2 my-1 text-slate-300"><span class="text-emerald-400 font-bold">✓</span><span class="line-through text-slate-400">${formatInlineMarkdown(escapeHtml(trimmed.slice(6)))}</span></div>`
          );
        } else if (/^- \[ \] /.test(trimmed)) {
          out.push(
            `<div class="flex items-start gap-2 my-1 text-slate-200"><span class="text-sky-400 font-bold">☐</span><span>${formatInlineMarkdown(escapeHtml(trimmed.slice(6)))}</span></div>`
          );
        } else if (/^[-*] /.test(trimmed)) {
          out.push(
            `<div class="flex items-start gap-2 my-1 text-slate-200"><span class="text-sky-400">•</span><span>${formatInlineMarkdown(escapeHtml(trimmed.slice(2)))}</span></div>`
          );
        } else {
          out.push(`<p class="my-1 text-slate-200 leading-relaxed">${formatInlineMarkdown(escapeHtml(line))}</p>`);
        }
      }

      flushCode();
      return out.join("");
    }

    function isRoomPayloadUtilised(data) {
      if (!data || typeof data !== "object") return false;
      if (Array.isArray(data.elements) && data.elements.length > 0) return true;
      if (!Array.isArray(data.notes)) return false;
      return data.notes.some((n) => {
        if (!n) return false;
        const body = String(n.content || "").trim();
        const title = String(n.title || "").trim();
        const hasCustomTitle =
          title.length > 0 &&
          title !== "Shared Scratchpad" &&
          !/^Note \d+$/i.test(title);
        return body.length > 0 || hasCustomTitle;
      });
    }

    function isLocalRoomUtilised(code) {
      try {
        const raw = localStorage.getItem(`syncpad_room_${code}`);
        if (!raw) return false;
        return isRoomPayloadUtilised(JSON.parse(raw));
      } catch {
        return false;
      }
    }

    function Icon({ name, className = "w-4 h-4" }) {
      const paths = {
        fileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></>,
        penTool: <><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></>,
        columns: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/></>,
        copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>,
        check: <polyline points="20 6 9 17 4 12"/>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,

        highlighter: <><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></>,
        eraser: <><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></>,
